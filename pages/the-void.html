<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Void · Paradox</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .void { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; height: calc(100vh - 80px); }
    .void h2 { margin: 0 0 4px; }
    .void .sub { color: var(--muted); font-size: 0.9rem; margin-bottom: 16px; }
    #messages {
      flex: 1; overflow-y: auto; padding: 8px 0;
      display: flex; flex-direction: column; gap: 10px;
    }
    .msg-row { display: flex; gap: 10px; align-items: flex-start; }
    .msg-row .who { font-weight: 500; color: var(--accent); min-width: 90px; font-size: 0.9rem; }
    .msg-row .body { flex: 1; word-break: break-word; }
    .msg-row .time { color: var(--muted); font-size: 0.75rem; white-space: nowrap; }
    .composer {
      display: flex; gap: 8px; padding: 12px 0; border-top: 1px solid var(--line);
    }
    .composer input {
      flex: 1; padding: 12px 14px; border-radius: 12px;
      border: 1px solid var(--line-strong); background: #0e0e18; color: #fff; font: inherit;
    }
    .composer button {
      padding: 0 18px; border-radius: 12px; border: 0;
      background: var(--accent); color: #fff; font: inherit; font-weight: 500; cursor: pointer;
    }
    .composer button:disabled { opacity: 0.5; cursor: not-allowed; }
    .guest-note { text-align: center; color: var(--muted); padding: 12px; font-size: 0.9rem; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="user" href="profile.html">
        <span class="avatar" aria-hidden="true"></span>
        <span class="user-text">
          <span class="user-name" id="user-name">…</span>
          <span class="user-handle" id="user-handle">@…</span>
        </span>
      </a>
      <a class="brand" href="../index.html"><i data-lucide="ghost"></i><span>Paradox</span></a>
      <a class="coins" href="store.html" title="Your coins"><i data-lucide="coins"></i><span id="coin-count">0</span></a>
    </div>
  </header>

  <main class="wrap void">
    <h2>The Void</h2>
    <p class="sub">Public chat · everyone can see</p>

    <div id="messages"></div>

    <div id="composer-wrap">
      <div class="composer">
        <input type="text" id="input" placeholder="Say something…" maxlength="500" autocomplete="off">
        <button id="send">Send</button>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script src="../js/main.js"></script>
  <script>
    const messagesEl = document.getElementById('messages');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    let signedIn = false;

    function formatTime(iso) {
      const d = new Date(iso);
      return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function addMessage(row, prepend = false) {
      const handle = row.profiles?.handle || 'anon';
      const el = document.createElement('div');
      el.className = 'msg-row';
      el.innerHTML = `
        <span class="who">@${handle}</span>
        <span class="body">${escapeHtml(row.content)}</span>
        <span class="time">${formatTime(row.created_at)}</span>
      `;
      if (prepend) messagesEl.prepend(el);
      else {
        messagesEl.appendChild(el);
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, c =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])
      );
    }

    async function load() {
      const { data, error } = await Paradox.getVoidMessages(80);
      messagesEl.innerHTML = '';
      if (error) {
        messagesEl.innerHTML = `<p class="guest-note">${error.message}</p>`;
        return;
      }
      (data || []).reverse().forEach(row => addMessage(row));
    }

    async function checkAuth() {
      const user = await Paradox.getUser();
      signedIn = !!user;
      if (!signedIn) {
        document.getElementById('composer-wrap').innerHTML =
          `<p class="guest-note"><a href="profile.html">Sign in</a> to chat in The Void.</p>`;
      }
    }

    async function send() {
      const text = input.value.trim();
      if (!text || !signedIn) return;
      sendBtn.disabled = true;
      const { error } = await Paradox.postVoidMessage(text);
      sendBtn.disabled = false;
      if (error) {
        alert(error.message);
        return;
      }
      input.value = '';
    }

    sendBtn.onclick = send;
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') send();
    });

    (async () => {
      await checkAuth();
      await load();
      Paradox.subscribeVoid(row => addMessage(row));
    })();
  </script>
</body>
</html>
